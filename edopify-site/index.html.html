<td><div class="ra">${x?`<a href="#/shop/${s.id}">View</a><a href="#/chat/${s.id}">Chat${u?`<span class="dot">${u}</span>`:''}</a><button class="link" onclick="A.rec(${s.id})">${S.rec===s.id?'Unrecommend':'Recommend'}</button><button class="link" onclick="A.verify(${s.id})">${x.verified?'Unverify':'Verify'}</button><button class="link" onclick="A.star(${s.id})">${x.star?'Unpin':'Pin first'}</button><button class="link" onclick="A.hide(${s.id})">${x.hidden?'Show':'Hide'}</button><button class="link" onclick="A.suspend(${s.id})">${x.suspended?'Lift suspension':'Suspend'}</button>${x.pending?`<button class="link" onclick="A.approve(${s.id})">Approve</button>`:''}<button class="link" onclick="A.note(${s.id})">Note</button>`:''}<button class="link" onclick="A.newpw(${s.id})">New password</button>${x?`<button class="link danger" onclick="A.clear(${s.id})">${ar('c'+s.id,'Remove shop')}</button>`:''}<button class="link danger" onclick="A.rmSlot(${s.id})">${ar('r'+s.id,'Delete password')}</button></div></td></tr>`}).join('')||'<tr><td colspan="7" class="mut">Nothing matches.</td></tr>'}</table></div>`}
